  <body>
    <!-- Hardware-accelerated Neural Clarity and AI Micro-Contrast Enhancement Filter for High-Def Video Rendering -->
    <svg width="0" height="0" class="sr-only" aria-hidden="true" style="position: absolute; width: 0; height: 0; pointer-events: none;">
      <defs>
        <filter id="ai-neural-clarity" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
          <!-- Subpixel neural unsharp mask: sharpens fabric, embroidery, light reflections without digital noise -->
          <feConvolveMatrix
            order="3"
            preserveAlpha="true"
            kernelMatrix="0 -0.12 0 -0.12 1.48 -0.12 0 -0.12 0"
          />
        </filter>
        <filter id="ai-hdr-boost" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
          <!-- Dynamic HDR color matrix: expands dynamic range for deep blacks and vibrant highlights -->
          <feColorMatrix
            type="matrix"
            values="1.05 0    0    0 0
                    0    1.05 0    0 0
                    0    0    1.05 0 0
                    0    0    0    1 0"
          />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
